# SearXNG settings for the Sift backend. `use_default_settings` inherits all the
# engine parsers; set a real secret key on your box:
#   openssl rand -hex 32
use_default_settings: true

server:
  secret_key: "CHANGE_ME"
  limiter: true
  image_proxy: false

search:
  formats:
    - html
    - json

# More general web engines than SearXNG's defaults, so one engine rate-limiting
# Sift (Brave and Google suspend for minutes after a burst; DuckDuckGo shows a
# CAPTCHA) doesn't leave web, people and shopping searches empty. Merged by name
# into the default engine list. (google, qwant and yep were tried and are
# blocked from typical home/server IPs, so they stay off.)
engines:
  - name: bing
    disabled: false
  - name: yahoo
    disabled: false
  - name: mwmbl
    disabled: false
