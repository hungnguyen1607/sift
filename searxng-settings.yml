# SearXNG settings for the Sift backend. `use_default_settings` inherits all the
# engine parsers; set a real secret key on your box:
#   openssl rand -hex 32
use_default_settings: true

server:
  secret_key: "CHANGE_ME"
  limiter: true
  image_proxy: false

search:
  formats:
    - html
    - json
