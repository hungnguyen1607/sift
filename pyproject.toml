[project]
name = "sift"
version = "0.5.0"
description = "Open-source, self-hostable search API for AI agents. Tavily-compatible, token-budgeted, citation-precise."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "asyncpg>=0.29",
  "redis>=5.0",
  "trafilatura>=2.0",
  "htmldate>=1.9",
  "lxml>=5.0",
  "fastembed>=0.5",
  "tiktoken>=0.7",
  "mcp<2",
  "pyarrow>=15.0",
]

[project.scripts]
sift = "sift.cli.sift:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "fakeredis>=2.23", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sift"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
